
name: Secure ML CI

on:
  push:
    branches:
      - main
      - lab3-ci
      - 'lab3-demo-*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ml-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secure-ml:
    name: ML Quality and Security
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    defaults:
      run:
        shell: bash

    steps:
      # 1. Получение исходного кода
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # 2. Установка Python
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
          mkdir -p metrics security models

      # 3. Получение проверенной модели
      - name: Download and verify model
        run: |
          curl --fail --location --retry 3 \
            --output models/baseline_tfidf_logreg.joblib \
            https://github.com/DaniilLog/prompt-injection-detection-ml-security/releases/download/model-v1.0.0/baseline_tfidf_logreg.joblib

          sha256sum -c security/model.sha256

      - name: Record build information
        run: |
          echo "$GITHUB_SHA" > metrics/ci_commit.txt
          date -u -Is > metrics/ci_date.txt
          python --version > metrics/ci_python.txt

      # 4. Проверки исходного кода
      - name: Ruff lint
        run: |
          ruff check src/ tests/ 2>&1 | tee metrics/ci_ruff.txt

      - name: Bandit security analysis
        run: |
          python -m bandit -r src/ -f txt \
            2>&1 | tee security/ci_bandit.txt

      # 5. Автоматические тесты
      - name: Pytest
        run: |
          python -m pytest tests/ -q \
            --junitxml=metrics/ci_pytest.xml

      # 6. Аудит зависимостей
      - name: Dependency audit
        run: |
          python -m pip_audit \
            -r requirements.txt \
            -f json \
            -o security/ci_pip_audit.json

      # 7. Проверка контрольных данных
      - name: Verify fixture SHA256
        run: sha256sum -c ci/fixture.sha256

      - name: Data Quality Gate
        run: python -m src.data_gate

      # 8. Проверка качества модели
      - name: Evaluate candidate model
        run: python -m src.evaluate_ci_candidate


      - name: Model Quality Gate
        run: python -m src.model_gate

      # 9. Сборка Docker
      - name: Build Docker image
        run: |
          docker build --pull \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t ml-project:lab3 .

      # 10. Проверка контейнера
      - name: Non-root and smoke test
        run: |
          test "$(docker run --rm --entrypoint id ml-project:lab3 -u)" = "10001"

          docker run --rm \
            --network none \
            --read-only \
            --cap-drop=ALL \
            --security-opt no-new-privileges \
            ml-project:lab3

      # 11. Установка Trivy
      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.76.1

      # 12. Сканирование Docker-образа
      - name: Trivy image full report
        run: |
          trivy image --scanners vuln \
            --format json \
            --output security/trivy_ci_image_full.json \
            ml-project:lab3

      - name: Trivy Image Security Gate
        run: |
          trivy image --scanners vuln \
            --severity CRITICAL \
            --exit-code 1 \
            --format json \
            --output security/trivy_ci_image_critical.json \
            ml-project:lab3

      # 13. Анализ Dockerfile

      # DEMO 3: Safe simulation of a CRITICAL vulnerability
      - name: Security Gate (DEMO - simulated CRITICAL)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = {
              "SchemaVersion": 2,
              "ArtifactName": "SIMULATED_SECURITY_REPORT",
              "Results": [
                  {
                      "Target": "DEMO_ONLY",
                      "Vulnerabilities": [
                          {
                              "VulnerabilityID": "DEMO-CRITICAL-001",
                              "PkgName": "simulated-package",
                              "InstalledVersion": "0.0.0",
                              "FixedVersion": "0.0.1",
                              "Severity": "CRITICAL"
                          }
                      ]
                  }
              ]
          }

          output = Path(
              "security/ci_demo_security_report.json"
          )

          output.write_text(
              json.dumps(report, indent=4),
              encoding="utf-8"
          )

          data = json.loads(
              output.read_text(encoding="utf-8")
          )

          findings = [
              item
              for result in data["Results"]
              for item in result.get("Vulnerabilities", [])
          ]

          blocking = [
              item for item in findings
              if str(item.get("Severity", "UNKNOWN")).upper()
              not in ("LOW", "MEDIUM", "HIGH")
          ]

          print("SECURITY GATE DEMONSTRATION")
          print("Report:", output)
          print("Total findings:", len(findings))
          print("Blocking findings:", len(blocking))

          if blocking:
              print("SECURITY GATE: FAILED (SIMULATION)")
              raise SystemExit(1)

          print("SECURITY GATE: PASSED")
          PY

      - name: Trivy config full report
        run: |
          trivy config \
            --format json \
            --output security/trivy_ci_config_full.json \
            Dockerfile

      - name: Trivy Config Security Gate
        run: |
          trivy config \
            --severity UNKNOWN,HIGH,CRITICAL \
            --exit-code 1 \
            --format json \
            --output security/trivy_ci_config_gate.json \
            Dockerfile

      # 14. Сохранение отчетов даже при ошибке
      - name: Upload CI reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ml-ci-reports-${{ github.run_id }}
          path: |
            metrics/*.json
            metrics/*.xml
            metrics/*.txt
            security/ci_*.json
            security/ci_*.txt
            security/trivy_ci_*.json
          if-no-files-found: warn
          retention-days: 30
